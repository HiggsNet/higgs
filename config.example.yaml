# Higgs example configuration.
#
# Copy this file to config.yaml and fill the identity/trust fields for the
# node you are running. The default runtime is deliberately conservative:
# gossip works as an unprivileged process. Runtime layers such as IPsec/XFRM,
# BIRD, firewall, health probes, and the observer are enabled by declaring their
# config blocks; set disabled: true to keep a block without reconciling it.

# -----------------------------------------------------------------------------
# 1. Local identity, state, and gossip
# -----------------------------------------------------------------------------

# Default data_dir is /etc/higgs. Use a relative path for local development.
# data_dir: .higgs

# For a joined daemon node, prefer the zone FQDN as managed_zone and peer_id.
# The first load with managed_zone + identity.key_path can create a pending
# bootstrap state and print a join request instead of embedding private key
# material in config.yaml.
# managed_zone: node-a.catofes.
# identity:
#   key_path: .higgs/identity.key.json

peer_id: node-a.catofes.
listen_addr: 0.0.0.0:33434

bootstrap:
  - id: node-b.catofes.
    addr: 127.0.0.1:33435

# Base64 encoded raw 32-byte ED25519 public key for the trusted root zone.
# CLI output uses base64; existing hex values are still accepted.
trusted_root_public_key:

# -----------------------------------------------------------------------------
# 2. Gossip limits, logging, and endpoint discovery
# -----------------------------------------------------------------------------

# Public-internet safe defaults. Higgs does not depend on IP fragmentation.
# max_datagram_bytes: 1200
# max_sync_zones: 16
# max_sync_records: 1024

# Supported levels: debug, info, warn, error. HIGGS_LOG_LEVEL overrides this.
# log_level: info
#
# Runtime logs default to stderr. Set log.mode when a daemon should also copy
# structured logs to a file or syslog. Supported modes: stderr, file, syslog,
# stderr+file, stderr+syslog.
# log:
#   level: info
#   mode: stderr+file
#   file: /var/log/higgs.log
#   syslog_facility: daemon

# Explicit publish addresses are preferred over reflector/interface discovery.
# advertise_addrs:
#   - 203.0.113.10:33434

# Endpoint discovery modes:
#   all             advertise_addrs + reflectors + interface scan
#   loopback_only   only loopback listen/advertise addresses
#   advertise_only  only explicit advertise_addrs
# If unset and all bootstrap peers are loopback, daemon treats this as
# loopback_only automatically.
# endpoint_discovery: all
# publish_endpoints: true

# reflectors: auto
# reflector_interval: 5m
# reflector_timeout: 3s
# endpoint_ttl: 1h
# endpoint_grace: 10m

# Address source priority for outbound gossip endpoint selection.
# endpoint_source_order:
#   - advertise
#   - bootstrap
#   - reflector
#   - interface

# Exclude RFC1918 IPv4 addresses found by interface scan from signed endpoint
# publication. Set false for private-network labs that intentionally publish
# RFC1918 addresses.
# filter_private_ipv4: true

# Dynamic peer lifecycle. Stale/offline peers are retained with lower retry
# pressure; cleanup_after removes Higgs-owned SA/interface/route/firewall state.
# peer_lifecycle:
#   stale_after: 15m
#   offline_after: 12h
#   cleanup_after: 48h
#   keep_sa_while_stale: true

# -----------------------------------------------------------------------------
# 3. Network namespaces, IPsec, and link policy
# -----------------------------------------------------------------------------

# Network namespaces are declared once here and referenced by overlays, BIRD
# routing instances, and firewall instances. `default` is the implicit netns for
# overlay link groups when overlays[].netns is omitted.
netns:
  default:
    kind: name
    name: h2
    create: true

ipsec:
  # This section configures the local IPsec provider. It does not, by itself,
  # publish IPsec capability records. Higgs publishes ipsec/* records only
  # when a local overlay/link group below selects provider: strongswan.
  #
  # accept declares this node's inbound capability: none, inbound, or
  # bidirectional. It also determines whether this node initiates links.
  # Default is inbound (accept incoming, do not initiate).
  # accept: inbound
  #
  # Default driver is strongswan. For unprivileged development or CI without
  # charon/VICI/XFRM, explicitly set driver: dry-run.
  # driver: strongswan
  # Higgs does not start charon; strongswan mode connects to an existing VICI
  # socket from a system-managed or externally started charon process. Empty
  # uses govici/strongSwan's default socket path.
  # vici_socket: /run/charon.vici

  # fixed publishes the charon listener ports directly. range publishes
  # deterministic advertised entry ports from port_range while charon keeps its
  # stable local 500/4500 sockets. In range mode, host firewall instances
  # default host_ports.ike/natt and redirect_grace to enabled so advertised
  # entry ports DNAT back to charon; explicitly disable them if another
  # firewall manager owns those rules. Previous advertised ports are published
  # during grace.
  # port_mode: fixed
  # port_range:
  #   from: 30000
  #   to: 30099
  # port_rotate_interval: 24h
  # port_previous_grace: 10m

  # IPsec-specific addresses and DNS names to publish, independent of the
  # top-level advertise_addrs used for gossip. announce_addrs are published as
  # manual-address; announce_dns are published as manual-dns and resolved by
  # peers. publish_from_endpoints (default true) also publishes addresses from
  # gossip endpoint discovery (reflector + interface scan) as discovery/reflector
  # /local sources.
  # announce_addrs:
  #   - 203.0.113.10:4500
  # announce_dns:
  #   - vpn.example.com
  # publish_from_endpoints: true

# Uncomment an overlay/link group to participate in the StrongSwan mesh. This
# is the switch that makes the daemon publish signed ipsec/profile,
# ipsec/addresses, ipsec/ports, and ipsec/transport-key records for this node.
# Future providers such as WireGuard should be configured as their own provider
# family, not under the ipsec: provider settings.
#
# overlays:
#   - id: ipsec-main
#     name: ipsec-main
#     # provider defaults to strongswan. It is the overlay transport provider,
#     # not the generic "ipsec" record namespace name.
#     # provider: strongswan
#     # netns defaults to netns.default. Set a reference here only when this
#     # link group should use another declared netns.
#     # netns: default
#     # default_path_mode: family-redundant
#     # address_source_order:
#     #   - manual-address
#     #   - manual-dns
#     #   - discovery
#     #   - reflector
#     # max_peers defaults to unlimited. Set a positive value to cap selected
#     # peers in this link group.
#     # max_peers: 256
#     # max_links_per_peer: 2
#
#     # tunnel_address defaults to IPv6 derived-link-local, so this block is
#     # usually unnecessary. Modes:
#     #   derived-link-local  deterministic IPv6 fe80::/64 scoped address
#     #   derived-pool        deterministic address from tunnel_address.pool
#     #   sequential-pool     legacy index-based allocation
#     #   disabled            no tunnel address
#     # tunnel_address:
#     #   mode: derived-pool
#     #   family: ipv6
#     #   pool: fd00:4242::/64
#
#     # reconcile is mostly event-driven; interval is only the periodic safety
#     # sweep for SA observation/recovery. Defaults: interval 1m,
#     # rotate_retention 1h. Backoff is retry throttle after failed provider
#     # apply, not normal reconcile frequency; default is exponential 1s..1m,
#     # and the next attempt still waits for an event or safety sweep.
#     # reconcile:
#     #   interval: 1m
#     #   rotate_retention: 1h
#     #   backoff:
#     #     initial: 1s
#     #     max: 1m
#
#     connect:
#       - "strongswan://*.catofes.?accept=bidirectional&family=dual&source=manual-dns,discovery&mode=family-redundant"
#     deny:
#       - "strongswan://*.lab.catofes."

# -----------------------------------------------------------------------------
# 4. Per-netns BIRD/Babel routing and IPAM
# -----------------------------------------------------------------------------

# ipam:
#   # When true, daemon publishes routes/announcements/* for IPAM assignments
#   # whose assigned_to equals managed_zone. Defaults false for explicit control.
#   auto_announce_assigned_ips: false

routing:
  instances:
    - id: main
      netns: default
      # disabled: true
      # provider is the managed routing backend. "bird" runs BIRD with a Babel
      # protocol stanza inside the generated bird.conf; babeld is not supported.
      # provider: bird
      # mode: managed
      # table: main
      # metric_base: 100
      # metric_staged: 200
      # metric_draining: 500
      # interface_pattern: hgs*
      # ECMP knobs are parsed for future/alternate backends, but current BIRD
      # rendering does not emit Babel ECMP directives; leave them unset here.

      # Optional veth upstream for main-network Babel peering. Higgs starts BIRD
      # in the target netns; BIRD itself cannot switch namespaces after start.
      # upstream:
      #   disabled: true
      #   create_veth: true
      #   upstream_interface: hgs-2host     # mesh netns side, toward host
      #   downstream_interface: hgs-2higgs  # peer_netns / host side, toward Higgs
      #   peer_netns: ""          # empty = init/main netns
      #   upstream_ipv4_ll: 169.254.0.1/30
      #   downstream_ipv4_ll: 169.254.0.2/30
      #   upstream_ipv6_ll: fe80::1/64
      #   downstream_ipv6_ll: fe80::2/64

# -----------------------------------------------------------------------------
# 5. Firewall, health probes, and read-only observer
# -----------------------------------------------------------------------------

firewall:
  instances:
    - id: h2
      netns: default
      # disabled: true
      # mode: managed
      # backend: auto
      # default_policy: drop
      # xfrm_tunnel_pattern: hgs*
      # forwarding:
      #   transit: false
      #   allow_prefixes:
      #     - 10.42.0.0/16
      #   deny_prefixes:
      #     - 10.99.0.0/24

    - id: host-ipsec
      host: true
      # disabled: true
      # mode: managed
      # backend: auto
      # Listen addresses used for host ingress and DNAT/redirect rules.
      # Defaults to top-level advertise_addrs. Set this when the host is behind
      # a gateway that DNATs public addresses to local addresses before packets
      # reach the local firewall; rules must then match the post-DNAT local IP.
      # listen_addrs:
      #   - 172.17.16.168
      # In ipsec.port_mode=range, these host IPsec ingress/redirect settings
      # default to enabled. Uncomment false/disabled values only if external
      # firewall rules own IKE/NAT-T and advertised-port redirect.
      # host_ports:
      #   ike: false
      #   natt: false
      # redirect_grace:
      #   disabled: true

