data_dir: .higgs
# Optional Phase 4.0.1 identity overlay. For a new node, set managed_zone,
# trusted_root_public_key, identity.key_path, and at least one bootstrap peer;
# the first daemon/CLI state load creates a pending bootstrap state and prints
# the join request instead of embedding a private key in config.yaml.
# managed_zone: node-a.catofes.
# identity:
#   key_path: .higgs/identity.key.json
peer_id: node-a
listen_addr: 127.0.0.1:33434

# Conservative datagram budget (default 1200 bytes). Higgs gossip does not rely
# on IP fragmentation. Raising this above 1200 is only recommended for lab or
# known-safe private networks; the public-internet default is 1200.
max_datagram_bytes: 1200
max_sync_zones: 16
max_sync_records: 1024
# Supported levels: debug, info, warn, error. Use debug for per-packet gossip
# and transport diagnostics.
log_level: info
reflectors: auto
reflector_interval: 5m
reflector_timeout: 3s
endpoint_ttl: 1h
endpoint_grace: 10m

# Endpoint discovery mode controls which local addresses are published as signed
# sync/endpoint/udp records:
#   all (default)         - use advertise_addrs, reflectors, and interface scan
#   loopback_only         - only loopback listen_addr / loopback advertise_addrs
#   advertise_only        - only explicit advertise_addrs
# When unset and all bootstrap peers are loopback, the daemon auto-detects a
# loopback-only deployment and behaves like loopback_only.
endpoint_discovery: all

# Address source priority used when merging bootstrap addresses with discovered
# endpoint records for outbound gossip. Default: advertise, bootstrap, reflector, interface.
# endpoint_source_order:
#   - advertise
#   - bootstrap
#   - reflector
#   - interface

# When true, RFC1918 IPv4 addresses (10.x, 172.16.x, 192.168.x) discovered
# from local network interfaces are excluded from the advertised endpoint list.
filter_private_ipv4: false

# Phase 6 IPAM configuration.
ipam:
  # When true, the daemon automatically publishes routes/announcements/* for
  # every IPAM assignment whose assigned_to equals this node's managed_zone.
  # Defaults to false so administrators keep explicit control over which
  # prefixes are announced.
  auto_announce_assigned_ips: false

bootstrap:
  - id: node-b
    addr: 127.0.0.1:33435

# Base64 encoded raw 32-byte ED25519 public key for the trusted root zone.
# CLI output uses base64; existing hex values are still accepted.
trusted_root_public_key:

# Phase 4 local overlay data-plane defaults. Link groups are local policy and
# are not published through gossip.
overlay:
  default_netns:
    kind: name
    name: h2
    create: true

ipsec:
  # Default is dry-run so normal daemon runs never require root, charon, VICI,
  # or XFRM privileges. Set to strongswan only on a prepared system-smoke host.
  driver: dry-run
  # Optional; empty uses strongSwan/govici's default VICI socket path.
  vici_socket:
  # Port rotation mode. "fixed" (default) keeps IKE/NAT-T on their default or
  # listen_addr-derived ports. "range" selects ports deterministically from the
  # configured range and advances generation per port_rotate_interval.
  port_mode: fixed
  # port_range:
  #   from: 30000
  #   to: 30099
  # port_rotate_interval: 24h
  # port_previous_grace: 10m

# Phase 5.7: Top-level netns definitions. Named network namespaces are shared
# by all overlays and routing instances that reference them.
netns:
  default:
    kind: name
    name: h2
    create: true

# Phase 5.7: Per-netns routing instances. One netns = one BIRD instance.
# Routing config has moved from overlays[].routing to this top-level section.
routing:
  instances:
    - id: main
      netns: h2
      enabled: true
      protocol: bird
      mode: managed
      # control_socket: /run/higgs/bird-h2.ctl    # defaults to <data_dir>/bird/bird-<netns>.ctl
      # pid_file: /run/higgs/bird-h2.pid          # defaults to <data_dir>/bird/bird-<netns>.pid
      # config_file: /run/higgs/bird-h2.conf      # defaults to <data_dir>/bird/bird-<netns>.conf
      table: main                # independent netns default: main (table 254)
      metric_base: 100
      metric_staged: 200
      metric_draining: 500
      interface_pattern: hgs*
      # router_id_label: foo-netns  # required only for path netns
      ecmp: true
      ecmp_limit: 16
      # Phase 6.1.7: Optional veth upstream for main-network Babel peering.
      # When enabled, BIRD listens on a second interface (veth) in addition
      # to XFRM tunnel interfaces. A protocol static block is generated for
      # local IPAM assignments routed via the upstream interface.
      upstream:
        enabled: false
        interface: hgs-upstream0       # mesh netns side of the veth pair
        create_veth: true              # Higgs creates and maintains the veth pair
        peer_interface: hgs-upstream1  # main network side
        peer_netns: ""                 # empty = init/main netns
        ipv4_ll: "169.254.0.1/30"      # optional IPv4 link-local for mesh side
        ipv6_ll: "fe80::1/64"          # optional IPv6 link-local for mesh side

overlays:
  - id: ipsec-main
    name: ipsec-main
    provider: strongswan
    default_path_mode: family-redundant
    direction: outbound
    address_source_order: manual-address, manual-dns, discovery, reflector
    max_peers: 64
    max_links_per_peer: 2
    # Tunnel address allocation mode. Modes:
    #   derived-link-local  IPv6 fe80::/64 scoped link-local (default for IPv6)
    #   derived-pool        Deterministic host from the configured pool
    #   sequential-pool     Legacy index-based allocation (testing/migration only)
    #   disabled            No tunnel address assigned (default for IPv4)
    # Legacy field tunnel_address_pool maps to sequential-pool and cannot be used
    # together with tunnel_address.
    tunnel_address:
      mode: derived-link-local
      family: ipv6
    reconcile:
      interval: 30s
      backoff:
        initial: 1s
        max: 1m
    # Phase 5.7: routing is now configured at the top level under routing.instances[].
    # This overlay shares the BIRD instance in netns "h2" with other overlays
    # that use the same netns.
    connect:
      - "strongswan://*.catofes.?accept=inbound&family=dual&source=manual-dns,discovery&mode=family-redundant&direction=outbound"
    deny:
      - "strongswan://*.lab.catofes."