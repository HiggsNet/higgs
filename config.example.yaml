data_dir: .higgs
peer_id: node-a
listen_addr: 127.0.0.1:33434

# Conservative datagram budget (default 1200 bytes). Higgs gossip does not rely
# on IP fragmentation. Raising this above 1200 is only recommended for lab or
# known-safe private networks; the public-internet default is 1200.
max_datagram_bytes: 1200
max_sync_zones: 16
max_sync_records: 1024
# Supported levels: debug, info, warn, error. Use debug for per-packet gossip
# and transport diagnostics.
log_level: info
reflectors: auto
reflector_interval: 5m
reflector_timeout: 3s
endpoint_ttl: 1h
endpoint_grace: 10m

# When true, RFC1918 IPv4 addresses (10.x, 172.16.x, 192.168.x) discovered
# from local network interfaces are excluded from the advertised endpoint list.
filter_private_ipv4: false

bootstrap:
  - id: node-b
    addr: 127.0.0.1:33435

# Base64 encoded raw 32-byte ED25519 public key for the trusted root zone.
# CLI output uses base64; existing hex values are still accepted.
trusted_root_public_key:
