# Install as /etc/higgs/service.yaml. This file belongs to the standalone
# higgs-services renderer, not to the Higgs daemon.
version: 1

networks:
  main:
    ipv4: "local;172.30.0.0/24;172.30.0.128/28;172.30.0.1"
    ipv6: "auto;::/112;::100/120;::1"

socks5:
  egress-cn:
    region: cn-east
    publish: main
    networks:
      # Base address: socks=::20, dns=::21, h2=::22.
      main: "::20"
    # Endpoint ACL reconcile is a later Phase 8 cut. higgs-services currently
    # refuses `publish` when allow_zones is non-empty, instead of ignoring it.
    # allow_zones:
    #   - clients.catofes.
    #   - "*.partners.catofes."

# Defaults are pinned to the images already used by the repository templates.
# Override globally only when required.
# images:
#   gost: ginuerzh/gost:2.11.5
#   smartdns: ghcr.io/higgsnet/smartdns:v1.0.4

# Artifact root defaults to /etc/higgs/services.
