# Install as /etc/higgs/service.yaml. This file belongs to the standalone
# higgs-services renderer, not to the Higgs daemon.
version: 1

# Defaults inherited by every network. A network-level value overrides this
# list. The default upstream veth's host-side name is hgv2mesh; use the actual
# stable host ingress interface (for example hgs0 when the overlay itself runs
# in the host namespace).
# network_defaults:
#   trusted_host_interfaces: [hgv2mesh]

networks:
  main:
    ipv4: "local;172.30.0.0/24;172.30.0.128/28;172.30.0.1"
    ipv6: "auto;::/112;::100/120;::1"
    # Optional per-network override:
    # trusted_host_interfaces: [hgv2mesh]
  # The main non-shared assignment is normally kept reachable by
  # config.yaml: ipam.announce: [non-shared]. higgs-services does not own it.
  # Shared Anycast networks use stable IPAM tags. The local main network does
  # not need a tag: auto intentionally selects the node's unique assignment.
  # cn:
  #   ipv6: "tag:socks5.cn;::/112;::100/120;::1"
  # asia:
  #   ipv6: "tag:socks5.asia;::/112;::100/120;::1"

socks5:
  networks:
    # Base address: socks=::20, dns=::21, h2=::22.
    main: "::20"
    # cn: "::20"
    # asia: "::20"
  # Each entry maps an attached network to the endpoint's discovery region.
  # The local endpoint and any number of Anycast endpoints may be published
  # together.
  publish:
    main: local
    # cn: cn
    # asia: asia
  # Optional local endpoint ACL. publish installs it through the running
  # Higgs daemon before publishing the signed service record.
  # allow_zones:
  #   - clients.catofes.
  #   - "*.partners.catofes."

# Defaults are pinned to the images already used by the repository templates.
# Override globally only when required.
# images:
#   gost: ginuerzh/gost:2.11.5
#   smartdns: ghcr.io/higgsnet/smartdns:v1.0.4

# Artifact root defaults to /etc/higgs/services.
# output_dir: /etc/higgs/services
